name: Make tutorial character backgrounds transparent

on:
  push:
    paths:
      - "assets/characters/tutorial-guy/*.jpg"
      - ".github/workflows/make-tutorial-transparent.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Remove connected backgrounds with full transparency
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder = Path("assets/characters/tutorial-guy")
          names = ["neutral_face","thinking_face","task_complete_face","you_did_it_face"]
          for name in names:
              im = Image.open(folder / f"{name}.jpg").convert("RGBA")
              px, w, h = im.load(), *im.size
              seen, stack = bytearray(w*h), []
              def bg(x,y):
                  r,g,b,_=px[x,y]
                  mx,mn=max(r,g,b),min(r,g,b)
                  return mx-mn <= 55 and (((r+g+b)/3) >= 160 or ((r+g+b)/3) <= 70)
              def seed(x,y):
                  p=y*w+x
                  if not seen[p] and bg(x,y):
                      seen[p]=1; stack.append((x,y))
              for x in range(w): seed(x,0); seed(x,h-1)
              for y in range(1,h-1): seed(0,y); seed(w-1,y)
              while stack:
                  x,y=stack.pop()
                  r,g,b,_=px[x,y]; px[x,y]=(r,g,b,0)
                  if x: seed(x-1,y)
                  if x+1<w: seed(x+1,y)
                  if y: seed(x,y-1)
                  if y+1<h: seed(x,y+1)
              im.save(folder / f"{name}.png","PNG",optimize=True)
          PY
      - name: Commit generated transparent PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/tutorial-guy/*.png
          git diff --cached --quiet || git commit -m "Make tutorial character backgrounds fully transparent"
          git push
