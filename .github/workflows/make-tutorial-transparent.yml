name: Make tutorial character backgrounds transparent

on:
  push:
    paths:
      - "assets/characters/tutorial-guy/*.jpg"
      - ".github/workflows/make-tutorial-transparent.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Remove only the connected outer background
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import math

          folder = Path("assets/characters/tutorial-guy")
          names = ["neutral_face","thinking_face","task_complete_face","you_did_it_face"]

          for name in names:
              src = folder / f"{name}.jpg"
              out = folder / f"{name}.png"
              im = Image.open(src).convert("RGBA")
              px = im.load()
              w, h = im.size

              # Use the actual corner colours as the background reference.
              # This is deliberately colour-based rather than "light/neutral",
              # so light hair and skin are not mistaken for the background.
              corners = [
                  px[0, 0][:3],
                  px[w - 1, 0][:3],
                  px[0, h - 1][:3],
                  px[w - 1, h - 1][:3],
              ]

              def near_background(x, y):
                  r, g, b, _ = px[x, y]
                  return min(
                      math.sqrt(
                          (r-cr) ** 2 +
                          (g-cg) ** 2 +
                          (b-cb) ** 2
                      )
                      for cr, cg, cb in corners
                  ) <= 42

              seen = bytearray(w * h)
              stack = []

              def seed(x, y):
                  p = y * w + x
                  if not seen[p] and near_background(x, y):
                      seen[p] = 1
                      stack.append((x, y))

              for x in range(w):
                  seed(x, 0)
                  seed(x, h - 1)
              for y in range(1, h - 1):
                  seed(0, y)
                  seed(w - 1, y)

              while stack:
                  x, y = stack.pop()
                  r, g, b, _ = px[x, y]
                  px[x, y] = (r, g, b, 0)

                  if x:
                      seed(x - 1, y)
                  if x + 1 < w:
                      seed(x + 1, y)
                  if y:
                      seed(x, y - 1)
                  if y + 1 < h:
                      seed(x, y + 1)

              im.save(out, "PNG", optimize=True)

          PY
      - name: Commit generated transparent PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/tutorial-guy/*.png
          git diff --cached --quiet || git commit -m "Preserve tutorial character colours in transparent PNGs"
          git push
