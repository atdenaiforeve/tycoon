name: Make tutorial character backgrounds transparent

on:
  push:
    paths:
      - "assets/characters/tutorial-guy/*.jpg"
      - ".github/workflows/make-tutorial-transparent.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Remove connected white/black backgrounds
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          folder = Path("assets/characters/tutorial-guy")
          names = [
              "neutral_face",
              "thinking_face",
              "task_complete_face",
              "you_did_it_face",
          ]

          for name in names:
              src = folder / f"{name}.jpg"
              dst = folder / f"{name}.png"

              im = Image.open(src).convert("RGBA")
              px = im.load()
              w, h = im.size
              seen = bytearray(w * h)
              stack = []

              def bg(x, y):
                  r, g, b, a = px[x, y]
                  mx = max(r, g, b)
                  mn = min(r, g, b)
                  neutral = (mx - mn) <= 45
                  brightness = (r + g + b) / 3
                  return neutral and (brightness >= 145 or brightness <= 55)

              def seed(x, y):
                  p = y * w + x
                  if seen[p] or not bg(x, y):
                      return
                  seen[p] = 1
                  stack.append((x, y))

              for x in range(w):
                  seed(x, 0)
                  seed(x, h - 1)
              for y in range(1, h - 1):
                  seed(0, y)
                  seed(w - 1, y)

              while stack:
                  x, y = stack.pop()
                  px[x, y] = (px[x, y][0], px[x, y][1], px[x, y][2], 0)
                  if x:
                      seed(x - 1, y)
                  if x + 1 < w:
                      seed(x + 1, y)
                  if y:
                      seed(x, y - 1)
                  if y + 1 < h:
                      seed(x, y + 1)

              im.save(dst, "PNG", optimize=True)

          PY

      - name: Use transparent PNGs in the game
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("js/features/tutorial.js")
          s = p.read_text()
          s = s.replace('const FACE_BASE = "assets/characters/tutorial-guy/";', 'const FACE_BASE = "assets/characters/tutorial-guy/";')
          s = s.replace('function removeOutsideBackground(src) {', 'function removeOutsideBackground(src) {')
          s = s.replace('const transparentFaces = new Map();', 'const transparentFaces = new Map();')
          s = s.replace('const face = index === 0 ? "neutral_face.jpg"\n          : index <= 4 ? "thinking_face.jpg"\n          : index === 5 ? "task_complete_face.jpg"\n          : "you_did_it_face.jpg";',
                        'const face = index === 0 ? "neutral_face.png"\n          : index <= 4 ? "thinking_face.png"\n          : index === 5 ? "task_complete_face.png"\n          : "you_did_it_face.png";')
          s = s.replace('const src = FACE_BASE + face;\n        guide.style.visibility = "hidden";\n\n        let transparentSrc = transparentFaces.get(src);\n        if (!transparentSrc) {\n          transparentSrc = await removeOutsideBackground(src);\n          transparentFaces.set(src, transparentSrc);\n        }\n\n        // Ignore a stale async result if the tutorial advanced while loading.\n        if (steps[index] !== step) return;\n        guide.src = transparentSrc;',
                        'const src = FACE_BASE + face;\n        guide.style.visibility = "hidden";\n\n        // The PNG already contains real alpha transparency.\n        if (steps[index] !== step) return;\n        guide.src = src;')
          p.write_text(s)
          PY

      - name: Commit generated PNGs and code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/tutorial-guy/*.png js/features/tutorial.js
          git diff --cached --quiet || git commit -m "Fix tutorial character transparency"
          git push
